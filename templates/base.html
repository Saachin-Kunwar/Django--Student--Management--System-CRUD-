<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: #212529;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: #fff;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #0d6efd;
        }

        /* Main content */
        .main {
            margin-left: 240px;
            padding: 20px;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-white text-center mb-4">🎓 Student MS</h4>

    <a href="{% url 'list' %}">📋 Students</a>
    <a href="{% url 'add' %}">➕ Add Student</a>
</div>

<!-- Main Content -->
<div class="main">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-4 px-3">
        <span class="navbar-brand">Dashboard</span>
    </nav>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
